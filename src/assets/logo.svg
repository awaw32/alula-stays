<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Desert terracotta to golden amber gradient -->
    <linearGradient id="alulaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C25E2E"/>
      <stop offset="50%" stop-color="#9C441E"/>
      <stop offset="100%" stop-color="#732F12"/>
    </linearGradient>
    
    <!-- Warm golden sunlight glow -->
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Gold Gradient for Calligraphy and Arches -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="35%" stop-color="#FDE68A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Dune Shadow Gradient -->
    <linearGradient id="duneShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5C240E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3D1708" stop-opacity="0.9"/>
    </linearGradient>
    
    <!-- Subtle drop shadow -->
    <filter id="clayShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3D1708" flood-opacity="0.45"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded luxury squircle background -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#alulaBg)" filter="url(#clayShadow)"/>
  
  <!-- Subtle inner border for luxury feel -->
  <rect x="26" y="26" width="460" height="460" rx="106" fill="none" stroke="url(#goldGradient)" stroke-width="4" stroke-opacity="0.4"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#sunGlow)"/>

  <!-- AlUla Mountain Silhouette (Elephant Rock / Hegra curves) -->
  <g opacity="0.95">
    <!-- Background mountain ridge -->
    <path d="M 40 370 Q 140 280 230 330 T 400 300 Q 450 330 472 365 L 472 470 Q 472 488 454 488 L 58 488 Q 40 488 40 470 Z" fill="#6B280E" opacity="0.65"/>
    
    <!-- Foreground desert dunes -->
    <path d="M 24 395 Q 160 340 280 405 T 488 385 L 488 470 Q 488 488 470 488 L 42 488 Q 24 488 24 470 Z" fill="url(#duneShade)"/>
    
    <!-- Golden rim line on the main dune -->
    <path d="M 24 395 Q 160 340 280 405 T 488 385" fill="none" stroke="url(#goldGradient)" stroke-width="3" opacity="0.75"/>
  </g>

  <!-- Architectural Nabataean Tomb Arch (Hegra Gateway) Silhouette -->
  <path d="M 180 340 L 180 210 Q 180 150 256 150 Q 332 150 332 210 L 332 340 Z" fill="none" stroke="url(#goldGradient)" stroke-width="6" stroke-linecap="round" opacity="0.35"/>
  <path d="M 198 340 L 198 220 Q 198 172 256 172 Q 314 172 314 220 L 314 340 Z" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-dasharray="6,6" opacity="0.3"/>

  <!-- Central "عُ" Emblem (AlUla Arabic Monogram) in rich sculpted gold -->
  <g filter="url(#softGlow)" transform="translate(256, 235)">
    <!-- Shadow for 3D depth -->
    <text x="0" y="38" text-anchor="middle" font-family="'Amiri', 'Traditional Arabic', 'Noto Naskh Arabic', serif" font-size="168" font-weight="bold" fill="#381304" opacity="0.7">عُ</text>
    <!-- Golden metallic letter -->
    <text x="-2" y="35" text-anchor="middle" font-family="'Amiri', 'Traditional Arabic', 'Noto Naskh Arabic', serif" font-size="168" font-weight="bold" fill="url(#goldGradient)">عُ</text>
  </g>

  <!-- Star / Sparkle of AlUla night sky -->
  <g transform="translate(370, 130)" fill="url(#goldGradient)">
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>
  <g transform="translate(130, 160)" fill="url(#goldGradient)" opacity="0.8">
    <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3"/>
  </g>

  <!-- Bottom Brand Arabic Inscription: شقق العلا -->
  <text x="256" y="445" text-anchor="middle" font-family="'Segoe UI', 'Tajawal', 'Cairo', sans-serif" font-size="28" font-weight="800" letter-spacing="2" fill="#FFFFFF" opacity="0.95">شقق العلا</text>
  <text x="256" y="468" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" letter-spacing="4" fill="url(#goldGradient)" opacity="0.9">ALULA STAYS</text>
</svg>
